# CI for this Vite + React + TypeScript app (managed via Lovable).
# Installs deps, lints, builds, and tests across a Node version matrix so a
# runner/Node deprecation (e.g. Node 20 EOL on GitHub runners) surfaces as a
# single matrix leg failing instead of breaking every build at once.
# No publish step — this is a private app, not an npm package.
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Keep every leg running so one Node version failing still reports the
      # others — that's how we spot version-specific breakage early.
      fail-fast: false
      matrix:
        # 22.x = current LTS floor, 24.x = active LTS / the runner default.
        node-version: [22.x, 24.x]
        include:
          # Next-major early warning. Allowed to fail so upstream churn on a
          # pre-release Node doesn't block merges.
          - node-version: 25.x
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    name: build (Node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # `npm ci` requires package-lock.json to be perfectly in sync with
      # package.json. Lovable can add a dependency and push before the lockfile
      # commit lands, which used to fail every matrix leg with EUSAGE. Fall back
      # to `npm install` in that case so CI reports real code problems instead.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::package-lock.json out of sync with package.json - falling back to npm install"
            npm install --no-audit --no-fund
          }


      # Lint runs in advisory mode: failures are reported but do not fail the
      # build. The codebase has known legacy `any`-type warnings that are
      # tracked separately and do not affect runtime behavior.
      - name: Lint (advisory)
        run: npm run lint || true

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run check:bundle

      # `npm run test --if-present` (not `npm test --if-present`) is the form npm
      # actually honors — the bare `npm test` alias treats the flag as a test arg.
      - name: Run tests
        run: npm run test --if-present

  # Edge-function unit tests (Deno). Covers the Parquet checkpoint/resume math:
  # a run that hits the 105s time budget must resume at the next row group
  # without re-transforming already-scored rows, and transient read failures
  # must retry only the failed row groups.
  edge-functions:
    name: edge function tests (Deno)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Supabase edge functions
        run: deno test --allow-net --allow-env --no-check supabase/functions/



  # Mobile layout visual regression: boots the built app and asserts no
  # clipped badges, overflowing tabs, or misaligned/overlapped sticky nav
  # across phone/tablet/desktop viewports. Runs on every PR.
  mobile-layout:
    name: mobile layout visual regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # Serve and assert in ONE step: a process backgrounded in its own step is
      # killed when that step's shell exits, so the previous split made the
      # layout checks fail with a connection error.
      - name: Serve built app and run mobile layout checks
        env:
          SONICSIM_BASE_URL: http://localhost:8080
        run: |
          set -euo pipefail
          npx vite preview --port 8080 --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/; then ready="yes"; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "preview server did not start" >&2
            cat /tmp/vite-preview.log >&2 || true
            exit 1
          fi
          python tests/mobile-layout/check_overlap.py
          python tests/mobile-layout/check_workspace_overflow.py

      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-screenshots
          path: tests/mobile-layout/screenshots
          if-no-files-found: ignore
