# CI for this Vite + React + TypeScript app (managed via Lovable).
# Installs deps, lints, builds, and tests across a Node version matrix so a
# runner/Node deprecation (e.g. Node 20 EOL on GitHub runners) surfaces as a
# single matrix leg failing instead of breaking every build at once.
# No publish step — this is a private app, not an npm package.
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Keep every leg running so one Node version failing still reports the
      # others — that's how we spot version-specific breakage early.
      fail-fast: false
      matrix:
        # 22.x = current LTS floor, 24.x = active LTS / the runner default.
        node-version: [22.x, 24.x]
        include:
          # Next-major early warning. Allowed to fail so upstream churn on a
          # pre-release Node doesn't block merges.
          - node-version: 25.x
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    name: build (Node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint runs in advisory mode: failures are reported but do not fail the
      # build. The codebase has known legacy `any`-type warnings that are
      # tracked separately and do not affect runtime behavior.
      - name: Lint (advisory)
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Run tests (if defined)
        run: npm test --if-present

  # Mobile layout visual regression: boots the built app and asserts no
  # clipped badges, overflowing tabs, or misaligned/overlapped sticky nav
  # across phone/tablet/desktop viewports. Runs on every PR.
  mobile-layout:
    name: mobile layout visual regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Serve built app on :8080
        run: |
          npx vite preview --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          echo "preview server did not start" >&2
          exit 1

      - name: Mobile layout checks
        env:
          SONICSIM_BASE_URL: http://localhost:8080
        run: |
          python tests/mobile-layout/check_overlap.py
          python tests/mobile-layout/check_workspace_overflow.py

      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-screenshots
          path: tests/mobile-layout/screenshots
          if-no-files-found: ignore
