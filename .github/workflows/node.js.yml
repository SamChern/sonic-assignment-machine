# CI for this Vite + React + TypeScript app (managed via Lovable).
# Installs deps, lints, and builds on Node 20. No publish step — this is a
# private app, not an npm package.
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint runs in advisory mode: failures are reported but do not fail the
      # build. The codebase has known legacy `any`-type warnings that are
      # tracked separately and do not affect runtime behavior.
      - name: Lint (advisory)
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Run tests (if defined)
        run: npm test --if-present
