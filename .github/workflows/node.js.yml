# CI for this Vite + React + TypeScript app (managed via Lovable).
# Installs deps, lints, builds, and tests across a Node version matrix so a
# runner/Node deprecation (e.g. Node 20 EOL on GitHub runners) surfaces as a
# single matrix leg failing instead of breaking every build at once.
# No publish step — this is a private app, not an npm package.
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Keep every leg running so one Node version failing still reports the
      # others — that's how we spot version-specific breakage early.
      fail-fast: false
      matrix:
        # 22.x = current LTS floor, 24.x = active LTS / the runner default.
        node-version: [22.x, 24.x]
        include:
          # Next-major early warning. Allowed to fail so upstream churn on a
          # pre-release Node doesn't block merges.
          - node-version: 25.x
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    name: build (Node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint runs in advisory mode: failures are reported but do not fail the
      # build. The codebase has known legacy `any`-type warnings that are
      # tracked separately and do not affect runtime behavior.
      - name: Lint (advisory)
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Run tests (if defined)
        run: npm test --if-present
