# systemd drop-in: multi-worker + tmpfs scratch for the existing service.
#
# Install (no port, nginx, or AWS change required):
#   sudo mkdir -p /etc/systemd/system/librosa-rest.service.d
#   sudo cp librosa-rest-tuning.conf /etc/systemd/system/librosa-rest.service.d/tuning.conf
#   sudo systemctl daemon-reload && sudo systemctl restart librosa-rest
#
# Keeps the SAME loopback port the running nginx upstream points at. Verify with:
#   grep -n 'server 127' /etc/nginx/sites-enabled/librosa-mcp
# and set LIBROSA_BIND below to match (default assumes 8766).

[Service]
# Scratch on RAM: audio decode writes temp WAVs, which is the hottest disk path.
PrivateTmp=true
Environment=LIBROSA_TMP=/tmp
Environment=TMPDIR=/tmp
Environment=MPLCONFIGDIR=/tmp/matplotlib-librosa
Environment=NUMBA_CACHE_DIR=/tmp/numba-cache
Environment=XDG_CACHE_HOME=/tmp/cache

# Multi-worker: one per core minus one, capped by the memory budget below
# (~1.2 GB peak per worker for a 5-minute track at default parameters).
Environment=LIBROSA_BIND=127.0.0.1:8766
Environment=LIBROSA_WORKERS=2
Environment=LIBROSA_TIMEOUT=300
Environment=LIBROSA_MAX_REQUESTS=200

# Keep BLAS from oversubscribing cores across workers.
Environment=OMP_NUM_THREADS=1
Environment=OPENBLAS_NUM_THREADS=1
Environment=MKL_NUM_THREADS=1

ExecStart=
ExecStart=/opt/librosa-mcp/.venv/bin/gunicorn -c /opt/librosa-mcp/gunicorn.conf.py server_rest:app

# Raise the ceilings from the single-worker defaults.
MemoryMax=6G
CPUQuota=
LimitNOFILE=65535
Restart=always
RestartSec=3s
