# /etc/nginx/sites-available/librosa-mcp
# Replace:
#   YOUR_HOST              → e.g. mcp.audio.example.com
#   TOKEN_GOES_HERE        → contents of /etc/librosa-mcp.token
#
# install.sh patches both placeholders for you.

# ---- token check applied to /librosa/* ----
# Reads the value from /etc/librosa-mcp.token at nginx startup. To rotate, write
# a new value and `sudo systemctl restart nginx` (reload won't pick up the file).
map $http_authorization $auth_ok {
    default                  0;
    "Bearer TOKEN_GOES_HERE" 1;
}

# ---- Per-IP rate limit so a runaway client can't pin the box ----
# 10 r/s sustained, burst 20, applied only to /librosa/.
limit_req_zone $binary_remote_addr zone=librosa_mcp:10m rate=10r/s;

# ---- Upstream with passive health check ----
upstream librosa_mcp_upstream {
    server 127.0.0.1:8765 max_fails=3 fail_timeout=15s;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name YOUR_HOST;

    # Replace with your real cert paths. `certbot --nginx` will fill these in for you.
    ssl_certificate     /etc/letsencrypt/live/YOUR_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_HOST/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Reasonable upload limit for audio passed inline (most calls just send file paths/URLs).
    client_max_body_size 50m;

    # ---- Librosa MCP (SSE) ----
    location /librosa/ {
        if ($auth_ok = 0) {
            return 401 '{"error":"missing or invalid Bearer token"}';
        }

        limit_req zone=librosa_mcp burst=20 nodelay;

        # Strip the /librosa prefix so upstream sees /sse, /messages, etc.
        rewrite ^/librosa/(.*)$ /$1 break;

        proxy_pass         http://librosa_mcp_upstream;
        proxy_http_version 1.1;

        # SSE essentials — must NOT buffer or close.
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering           off;
        proxy_cache               off;
        proxy_read_timeout        1h;
        proxy_send_timeout        1h;
        chunked_transfer_encoding on;

        # Rewrite the SSE endpoint event so clients POST back through /librosa/.
        # mcp-proxy doesn't know it's mounted at a sub-path, so it advertises
        # `data: /messages/?session_id=...`. Without this rewrite, the client
        # would POST to https://host/messages/... and get a 404 from nginx.
        sub_filter_types text/event-stream;
        sub_filter_once  off;
        sub_filter "data: /messages/" "data: /librosa/messages/";

        # CORS — the Supabase mcp-test/mcp-call edge functions are the real callers,
        # but allow direct browser debug from the Lovable preview origin too.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "authorization, content-type, accept" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Public health check — used by the included smoke-test.sh and any uptime monitor.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Deep health check — verifies the upstream MCP service is actually reachable.
    # No auth (returns only "ok"/"down"), so safe to expose to monitors.
    location = /healthz/upstream {
        access_log off;
        proxy_pass         http://127.0.0.1:8765/sse;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout    2s;
        # We only care that the upstream accepts the connection; intercept errors
        # so we return a stable string regardless of SSE handshake details.
        proxy_intercept_errors on;
        error_page 502 503 504 = @upstream_down;
    }
    location @upstream_down {
        return 503 "down\n";
        add_header Content-Type text/plain;
    }
}

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_HOST;
    return 301 https://$host$request_uri;
}
