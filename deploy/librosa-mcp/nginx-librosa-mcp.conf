# /etc/nginx/sites-available/librosa-mcp
# Replace:
#   YOUR_HOST              → e.g. mcp.audio.example.com
#   TOKEN_GOES_HERE        → contents of /etc/librosa-mcp.token

# ---- token check applied to /librosa/* ----
# Reads the value from /etc/librosa-mcp.token at nginx startup. To rotate, write
# new value, then `sudo systemctl restart nginx` (reload won't pick up the file).
map $http_authorization $auth_ok {
    default                 0;
    "Bearer TOKEN_GOES_HERE" 1;
}

server {
    listen 443 ssl http2;
    server_name YOUR_HOST;

    # Replace with your real cert paths. `certbot --nginx` will fill these in for you.
    ssl_certificate     /etc/letsencrypt/live/YOUR_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_HOST/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Reasonable upload limit for audio passed inline (most calls just send file paths/URLs).
    client_max_body_size 50m;

    # ---- Librosa MCP (SSE) ----
    location /librosa/ {
        if ($auth_ok = 0) {
            return 401 '{"error":"missing or invalid Bearer token"}';
        }

        # Strip the /librosa prefix so upstream sees /sse, /messages, etc.
        rewrite ^/librosa/(.*)$ /$1 break;

        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # SSE essentials — must NOT buffer or close.
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       1h;
        proxy_send_timeout       1h;
        chunked_transfer_encoding on;

        # CORS — the Supabase mcp-test/mcp-call edge functions are the real callers,
        # but allow direct browser debug from the Lovable preview origin too.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "authorization, content-type, accept" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Health check (no auth) — handy for uptime monitors.
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_HOST;
    return 301 https://$host$request_uri;
}
