# /etc/nginx/sites-available/semantic-svc — snippet to merge into the SAME
# server block that already fronts librosa-rest on this box.
#
# Adds a /semantic/* location proxying to the FastAPI service on :8769.
# Auth is checked twice: nginx Bearer match (cheap, blocks scanners) and again
# inside FastAPI (defense in depth), exactly like librosa-rest.
#
# Replace TOKEN_GOES_HERE with the token in /etc/semantic-svc.token.

map $http_authorization $semantic_auth_ok {
    default                  0;
    "Bearer TOKEN_GOES_HERE" 1;
}

# Embedding calls are cheap relative to librosa analysis, but the model is a
# single shared worker — keep the per-IP rate sane.
limit_req_zone $binary_remote_addr zone=semantic_svc:10m rate=5r/s;

upstream semantic_svc_upstream {
    server 127.0.0.1:8769 max_fails=3 fail_timeout=15s;
    keepalive 8;
}

