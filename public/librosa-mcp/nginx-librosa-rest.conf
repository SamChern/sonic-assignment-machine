# /etc/nginx/sites-available/librosa-rest  (snippet to merge into your existing
# librosa server block, OR drop in alongside it on a separate server_name).
#
# This adds a /librosa-rest/* location proxying to the FastAPI service on :8766.
# Auth is checked twice: nginx-level Bearer match (cheap, blocks scanners) and
# again inside FastAPI (defense in depth).
#
# Replace TOKEN_GOES_HERE with the token you wrote to /etc/librosa-rest.token.

map $http_authorization $rest_auth_ok {
    default                  0;
    "Bearer TOKEN_GOES_HERE" 1;
}

# Per-IP rate limit — analyze is CPU-heavy, keep it tight.
limit_req_zone $binary_remote_addr zone=librosa_rest:10m rate=2r/s;

upstream librosa_rest_upstream {
    server 127.0.0.1:8766 max_fails=3 fail_timeout=15s;
    keepalive 8;
}

