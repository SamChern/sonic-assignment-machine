# The EC2 DuckDB ingest worker has no user session: it authenticates with the
# service-role token or INGEST_WORKER_SECRET, validated in code.
[functions.ingest-worker-callback]
verify_jwt = false

# The Semantic Scope's meaning lens. Auth is validated in code (the function
# rejects anything without a live session token) so it can also be driven with
# the service-role key from tests.
[functions.scope-window-score]
verify_jwt = false

# Deterministic public artifact: same vector always yields the same audio, so
# anonymous callers are allowed. Any token supplied is still validated in code.
[functions.signature-render]
verify_jwt = false

# Tracking beacon: fired from the browser with no session at all. The pixel id
# is validated in code and only anonymous event rows are written.
[functions.pixel-collect]
verify_jwt = false

# The ingest worker bootstraps itself before it has any user session; it
# authenticates with INGEST_WORKER_SECRET / the service-role token, in code.
[functions.ingest-worker-bootstrap]
verify_jwt = false

